<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to ASCII SVG</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
<header>
  <h1>Image <span>to ASCII</span></h1>
  <p>Turn a photo into character art and download it as an SVG.</p>
</header>
<div class="workspace">
  <aside>
    <h2>Image &amp; settings</h2>
    <label id="drop" for="file"><strong>Choose an image</strong><span>or drop one here</span></label>
    <input id="file" type="file" accept="image/*" aria-label="Choose an image">
    <p id="status" role="status">Images are processed on your device.</p>
    <label for="detail">Detail <output id="detail-value">112</output></label>
    <input id="detail" type="range" min="24" max="220" value="112">
    <label for="contrast">Contrast <output id="contrast-value">115%</output></label>
    <input id="contrast" type="range" min="50" max="220" value="115">
    <label for="theme">SVG theme</label>
    <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select>
    <label class="check"><input id="invert" type="checkbox"> Invert tones</label>
    <label class="check"><input id="transparent" type="checkbox"> Transparent background</label>
  </aside>
  <section aria-labelledby="title">
    <div class="bar"><h2 id="title">ASCII preview</h2><button id="download" type="button" disabled>Download SVG</button></div>
    <div class="stage" id="stage">
      <div id="empty"><span aria-hidden="true">; + # @</span><p>Choose an image to see its ASCII preview.</p></div>
      <img id="preview" alt="Converted ASCII artwork" hidden>
    </div>
    <p id="dimensions" aria-live="polite"></p>
  </section>
</div>
</main>
</body>
</html>
